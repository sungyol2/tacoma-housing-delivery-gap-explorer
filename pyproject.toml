[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacoma-housing-delivery-gap"
version = "0.1.0"
description = "Parcel-level Tacoma housing capacity, feasibility, and permit-pipeline screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "geopandas>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.10",
  "pyogrio>=0.10",
  "pyyaml>=6.0",
  "requests>=2.32",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
