schema_version: 1
project_currency: USD
project_price_year: 2026
status: illustrative_financial_architecture_pending_market_validation

required_fields:
  - id
  - label
  - value
  - unit
  - scope
  - scenario
  - source
  - source_date
  - accessed_date
  - confidence
  - notes

allowed_values:
  scope:
    - parcel
    - market_area
    - prototype
    - scenario
  scenario:
    - conservative
    - baseline
    - favorable
    - all
  confidence:
    - high
    - medium
    - low

assumptions:
  - id: for_sale_price_per_unit
    label: For-sale missing-middle price per unit proxy
    value: 450000
    unit: USD_per_unit
    scope: market_area
    scenario: baseline
    source: config/market_evidence.yaml
    source_date: 2026-07-12
    accessed_date: 2026-07-12
    confidence: low
    notes: Low-confidence citywide screening baseline; anchored by a small public evidence sample, not a comparable-sales model.

  - id: hard_cost_per_gross_sqft
    label: Missing-middle hard construction cost
    value: 220
    unit: USD_per_gross_sqft
    scope: prototype
    scenario: baseline
    source: Tacoma Accela 2024-2026 new-building valuation cross-check
    source_date: 2024-2026
    accessed_date: 2026-07-12
    confidence: low
    notes: Common low-confidence screening proxy for all three prototypes. Recent described permits imply roughly $171-$214 per gross square foot in reported valuation, which is not total development cost or a contractor bid. A common value avoids an unsupported tenure-based cost difference.

  - id: soft_cost_pct_of_hard_cost
    label: Soft costs
    value: 0.18
    unit: proportion_of_hard_cost
    scope: prototype
    scenario: all
    source: Tacoma Accela valuation cross-check plus independent screening allowance
    source_date: 2026-07-11
    accessed_date: 2026-07-11
    confidence: low
    notes: Architecture, engineering, insurance, and development administration proxy. Explicitly excludes permit fees, financing, contingency, sales costs, and demolition to avoid double counting.

  - id: fee_pct_of_hard_cost
    label: Permit, utility, and impact fee proxy
    value: 0.05
    unit: proportion_of_hard_cost
    scope: prototype
    scenario: baseline
    source: City of Tacoma fee framework and project fee estimator; rounded screening proxy
    source_date: 2026
    accessed_date: 2026-07-13
    confidence: low
    notes: Scales with project hard cost instead of unit count. Not a project-specific calculation of building, utility, impact, fire, or right-of-way charges.

  - id: financing_pct_of_financeable_cost
    label: Construction financing carry and fees
    value: 0.04
    unit: proportion_of_financeable_cost
    scope: prototype
    scenario: baseline
    source: NAHB 2026 AD&C financing assumptions and Federal Reserve prime-rate cross-check; rounded screening proxy
    source_date: 2026
    accessed_date: 2026-07-13
    confidence: low
    notes: Applied to hard cost, scoped soft cost, fees, contingency, and demolition. The 4 percent proxy approximates interest carry and origination under partial construction-loan draws; it is not a draw schedule or loan quote.

  - id: demolition_allowance
    label: Demolition allowance
    value: 40000
    unit: USD_total
    scope: prototype
    scenario: baseline
    source: project_concept_mockup_illustrative_value
    source_date: null
    accessed_date: 2026-07-11
    confidence: low
    notes: Applied only where a mapped building footprint exists. Basic site construction is assumed within the hard-cost proxy; extraordinary grading, remediation, utility extension, and off-site work are not modeled.

  - id: contingency_pct_of_hard_cost
    label: Construction contingency
    value: 0.05
    unit: proportion_of_hard_cost
    scope: prototype
    scenario: all
    source: independent_screening_assumption
    source_date: 2026-07-11
    accessed_date: 2026-07-11
    confidence: low
    notes: Applied to hard cost.

  - id: required_developer_profit_pct
    label: Required developer profit
    value: 0.15
    unit: proportion_of_total_development_cost
    scope: scenario
    scenario: baseline
    source: NAHB 2026 builder gross-profit cross-check plus conservative small-infill screening hurdle
    source_date: 2026
    accessed_date: 2026-07-13
    confidence: low
    notes: Target return is applied to total development cost including supportable land, not only non-land cost. It exceeds the NAHB 9.8 percent national gross-profit observation to retain a conservative small-project hurdle; not an IRR.

  - id: sales_and_closing_cost_pct
    label: Sales, marketing, and closing costs
    value: 0.04
    unit: proportion_of_gross_sales
    scope: prototype
    scenario: all
    source: NAHB 2026 broker-fee assumption plus rounded closing and marketing allowance
    source_date: 2026
    accessed_date: 2026-07-13
    confidence: low
    notes: Includes the NAHB 2.9 percent broker-fee observation plus a rounded 1.1 percent closing and marketing allowance; not a project-specific sales budget.

  - id: rental_monthly_rent_per_unit
    label: Two-bedroom monthly rent proxy
    value: 1971
    unit: USD_per_unit_month
    scope: market_area
    scenario: baseline
    source: HUD FY2026 Tacoma WA HMFA Fair Market Rent schedule
    source_date: 2026
    accessed_date: 2026-07-12
    confidence: medium
    notes: Sourced proxy, not a new-construction asking-rent comp; Tacoma HMFA two-bedroom FMR.

  - id: rental_vacancy_pct
    label: Rental vacancy and collection loss
    value: 0.05
    unit: proportion_of_potential_income
    scope: prototype
    scenario: baseline
    source: independent_screening_assumption
    source_date: 2026-07-12
    accessed_date: 2026-07-12
    confidence: low
    notes: Illustrative stabilized allowance.

  - id: rental_operating_expense_pct
    label: Rental operating expenses
    value: 0.32
    unit: proportion_of_effective_income
    scope: prototype
    scenario: baseline
    source: independent_screening_assumption
    source_date: 2026-07-12
    accessed_date: 2026-07-12
    confidence: low
    notes: Includes management, maintenance, insurance, taxes, and reserves only as a screening ratio.

  - id: rental_cap_rate
    label: Stabilized multifamily capitalization rate proxy
    value: 0.050
    unit: proportion
    scope: market_area
    scenario: baseline
    source: Lee & Associates Pacific Northwest Q1 2026 Multifamily Market Report
    source_date: 2026-Q1
    accessed_date: 2026-07-13
    confidence: low
    notes: Corrected to the report's Q1 2026 value. Puget Sound transaction proxy, not a Tacoma small-project comp.

scenario_adjustments:
  conservative:
    sale_price_multiplier: 0.90
    hard_cost_multiplier: 1.10
    financing_multiplier: 1.15
    required_profit_multiplier: 1.10
    rent_multiplier: 0.95
    vacancy_multiplier: 1.20
    cap_rate_multiplier: 1.10
  baseline:
    sale_price_multiplier: 1.00
    hard_cost_multiplier: 1.00
    financing_multiplier: 1.00
    required_profit_multiplier: 1.00
    rent_multiplier: 1.00
    vacancy_multiplier: 1.00
    cap_rate_multiplier: 1.00
  favorable:
    sale_price_multiplier: 1.10
    hard_cost_multiplier: 0.90
    financing_multiplier: 0.85
    required_profit_multiplier: 0.90
    rent_multiplier: 1.1643835616
    vacancy_multiplier: 0.80
    cap_rate_multiplier: 0.90
