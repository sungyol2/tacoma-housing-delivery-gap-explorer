  - id: tacoma_steep_slopes
    title: Steep Slopes (Tacoma)
    publisher: City of Tacoma
    category: critical_area
    url: https://services3.arcgis.com/SCwJH1pD8WSn5T5y/arcgis/rest/services/Steep_Slopes_(Tacoma)/FeatureServer/0
    access_method: ArcGIS REST query
    service_type: ArcGIS FeatureServer polygon layer
    update_date: "2026-07-12"
    key_fields:
      - percentslope
      - slopecategory
      - geometry
    join_key: spatial_overlay_to_parcels
    license: City of Tacoma open-data terms
    download_test: target_parcel_intersection_confirmed_2026-07-12
    query:
      where: 1=1
      out_fields: percentslope,slopecategory,notes,last_edited_date
      page_size: 1000
    limitations:
      - Generalized screening geometry does not replace parcel-specific geotechnical review.
      - TMC applicability and buffers can extend beyond the mapped steep-slope polygon.

  - id: tacoma_wetland_inventory
    title: Wetland Inventory (Tacoma)
    publisher: City of Tacoma
    category: critical_area
    url: https://services3.arcgis.com/SCwJH1pD8WSn5T5y/arcgis/rest/services/Wetland_Inventory/FeatureServer/0
    access_method: ArcGIS REST query
    service_type: ArcGIS FeatureServer polygon layer
    update_date: "2026-07-08"
    key_fields:
      - Status
      - Category
      - DelineationDate
      - geometry
    join_key: spatial_overlay_to_parcels
    license: City of Tacoma open-data terms
    download_test: service_and_target_query_success_2026-07-12
    query:
      where: 1=1
      out_fields: CommonName,Status,StatusSource,Category,DelineationDate,SizeSqFt,last_edited_date
      page_size: 1000
