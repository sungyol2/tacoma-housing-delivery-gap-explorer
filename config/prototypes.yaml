schema_version: 2
status: pilot_missing_middle_prototypes

prototypes:
  duplex_for_sale:
    label: Duplex houseplex — for sale
    housing_type: houseplex
    role: small_scale_tenure_comparison
    tenure: for_sale
    units: 2
    bedrooms_per_unit: 2
    net_unit_area_sqft: 1200
    total_net_sellable_area_sqft: 2400
    gross_building_area_sqft: 2700
    stories: 2
    assumed_building_footprint_sqft: 1350
    parking_spaces: 2
    assumed_parking_and_access_sqft: 700
    minimum_screening_site_area_sqft: 3500
    minimum_screening_width_ft: 25
    confidence: low
    rationale:
      - Tacoma classifies a duplex as a 1-to-6-unit Houseplex.
      - Paired with the rental duplex to isolate tenure and valuation-method differences.
      - Site-area and envelope values are screening assumptions, not a site plan.

  duplex_rental:
    label: Duplex houseplex — rental
    housing_type: houseplex
    role: small_scale_tenure_comparison
    tenure: rental
    units: 2
    bedrooms_per_unit: 2
    net_unit_area_sqft: 900
    total_net_rentable_area_sqft: 1800
    gross_building_area_sqft: 2100
    stories: 2
    assumed_building_footprint_sqft: 1050
    parking_spaces: 2
    assumed_parking_and_access_sqft: 700
    minimum_screening_site_area_sqft: 3500
    minimum_screening_width_ft: 25
    confidence: low
    rationale:
      - Uses the same Tacoma Houseplex category as the for-sale duplex.
      - Tests stabilized rental value rather than unit-sale revenue.
      - Site-area and envelope values are screening assumptions, not a site plan.

  four_unit_rowhouse_rental:
    label: Four-unit rowhouse cluster — rental
    housing_type: rowhouse
    role: higher_intensity_missing_middle
    tenure: rental
    units: 4
    bedrooms_per_unit: 2
    net_unit_area_sqft: 1000
    total_net_rentable_area_sqft: 4000
    gross_building_area_sqft: 4700
    stories: 3
    assumed_building_footprint_sqft: 1600
    parking_spaces: 2
    assumed_parking_and_access_sqft: 900
    minimum_screening_site_area_sqft: 5000
    minimum_screening_width_ft: 40
    confidence: low
    rationale:
      - Tacoma permits Rowhouse Clusters of three to six attached Rowhouses in all UR zones.
      - Represents the pilot's more intensive rental missing-middle comparison.
      - Frontage, cluster width, alley access, and parking still require stronger envelope screening.
